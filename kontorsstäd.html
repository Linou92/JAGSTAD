<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Kontorsstäd</title>

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/service-page.css" />
  </head>

  <body data-service="Kontorsstäd">
    <main class="service-page">
      <section class="service-hero">
        <a href="index.html" class="back-link">← Tillbaka</a>

        <div class="service-icon">
          <img src="images/icons/kontorsstäd.svg" alt="Kontorsstäd Icon" />
        </div>

        <h1>Kontorsstäd</h1>
        <div class="service-gold-line"></div>
        <p>
          Boka professionell kontorsstädning anpassad efter ditt företags behov.
        </p>
      </section>

      <section class="booking-section">
        <form class="booking-form" id="booking-form">
          <div class="form-group">
            <label for="company">Företagsnamn</label>
            <input
              type="text"
              id="company"
              name="companyName"
              placeholder="Ex. J.A.G Städ AB"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">E-postadress</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Ex. kund@email.se"
              required
            />
          </div>

          <div class="form-group">
            <label for="phone">Telefonnummer</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="Ex. 070 123 45 67"
              required
            />
          </div>

          <div class="form-group">
            <label>Städtjänster</label>

            <div class="checkbox-grid">
              <label
                ><input
                  type="checkbox"
                  name="cleaningOptions"
                  
                />
                Regelbunden städning
              </label>
              <label
                ><input type="checkbox" name="cleaningOptions" />
                Storstädning
              </label>
              <label
                ><input type="checkbox" name="cleaningOptions"/>
                Fönsterputs
              </label>
              <label
                ><input type="checkbox" name="cleaningOptions"/>
                Golvvård
              </label>

              <label
                ><input type="checkbox" name="cleaningOptions"/>
                Desinficering
              </label>
            </div>
          </div>

          <div class="form-group">
            <label>Rum att städa</label>

            <div class="rooms-list">
              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Kontor
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Konferensrum
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Reception
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Kök/Pentry
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Toaletter
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions"/>
                  Korridorer
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions" value="Trappor" />
                  Trappor
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>

              <div class="room-item">
                <label>
                  <input type="checkbox" name="cleaningOptions" value="Personalrum" />
                  Personalrum
                </label>

                <div class="counter">
                  <button type="button" class="minus">−</button>
                  <span class="count">0</span>
                  <button type="button" class="plus">+</button>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group booking-calendar-area">
            <div class="calendar-column">
              <label class="calendar-title">Välj en ledig dag</label>

              <div class="custom-calendar">
                <div class="calendar-header">
                  <button
                    type="button"
                    id="prev-month"
                    aria-label="Föregående månad"
                  >
                    ‹
                  </button>
                  <h3 id="calendar-month"></h3>
                  <button
                    type="button"
                    id="next-month"
                    aria-label="Nästa månad"
                  >
                    ›
                  </button>
                </div>

                <div class="calendar-weekdays">
                  <span>Mån</span><span>Tis</span><span>Ons</span
                  ><span>Tor</span> <span>Fre</span><span>Lör</span
                  ><span>Sön</span>
                </div>

                <div class="calendar-days" id="calendar-days"></div>
              </div>
              <p class="selected-date-message" id="selected-date-message">
                Ingen dag är vald.
              </p>
            </div>
          </div>

          <button type="submit" class="submit-btn" id="booking-submit">
            Skicka bokningsförfrågan
          </button>
          <p id="booking-status" class="booking-status" aria-live="polite"></p>
          <p class="booking-confirmation" id="booking-confirmation">
            Tack! Din bokningsförfrågan har skickats. Vi kontaktar dig snart.
          </p>
        </form>
      </section>
    </main>

    <script src="javascript/service-page.js"></script>
  </body>
</html>
